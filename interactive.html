<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>File API Demo</title>
</head>
<body>

    <h1>File API Demo</h1>

    <input type="file" id="fileInput">

    <pre id="fileInfo">No file selected</pre>

    <script>
        document.getElementById('fileInput').addEventListener('change', (e) => {
            const file = e.target.files[0];

            document.getElementById('fileInfo').textContent =
                file ? `Name: ${file.name}, Size: ${file.size} bytes` : 'No file selected';
        });
    </script>

    <!-- Drop zone: user drags an image here -->
<div id="dropZone" style="border:2px dashed #64748b;padding:40px;text-align:center;">
  Drag an image here
</div>
<!-- Preview image appears here after drop -->
<img id="preview" alt="Preview" style="max-width:200px;margin-top:12px;">

<script>
  const dropZone = document.getElementById('dropZone');
  const preview = document.getElementById('preview');

  // Allow dropping by preventing default on dragover
  dropZone.addEventListener('dragover', (e) => e.preventDefault());

  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    const file = e.dataTransfer.files[0]; // File dragged onto the zone
    if (!file || !file.type.startsWith('image/')) return;

    const reader = new FileReader();
    reader.onload = () => { preview.src = reader.result; }; // Show image preview
    reader.readAsDataURL(file); // Read file as a data URL for the img src
  });
</script>

<!-- Native HTML5 video player (no plugins) -->
<video controls width="320">
  <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
</video>

<!-- Native HTML5 audio player -->
<audio controls>
  <source src="https://www.w3schools.com/html/horse.mp3" type="audio/mpeg">
</audio>

<!-- Button triggers location request -->
<button id="locBtn">Get my location</button>
<!-- Coordinates or error message shown here -->
<p id="location">Location not requested yet</p>
<script>
  document.getElementById('locBtn').addEventListener('click', () => {
    // Ask browser for device location (user must click Allow)
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        // Success: show latitude and longitude
        document.getElementById('location').textContent =
          `Lat: ${pos.coords.latitude}, Lng: ${pos.coords.longitude}`;
      },
      () => {
        // Error: user denied permission or location unavailable
        document.getElementById('location').textContent = 'Permission denied';
      }
    );
  });
</script>

<h2>Browser Information</h2>

<p id="context"></p>

<script>
    const ctx = {
        online: navigator.onLine,
        language: navigator.language,
        mobile: /Mobi|Android/i.test(navigator.userAgent)
    };

    document.getElementById('context').textContent =
        JSON.stringify(ctx, null, 2);

    console.log('PM-04 debug context:', ctx);
</script>

<!-- Text area where the user types a note -->
<textarea id="note" rows="4" cols="40" placeholder="Type a note..."></textarea><br>
<button id="saveBtn">Save locally</button>
<button id="loadBtn">Load saved note</button>
<p id="status"></p>
<script>
  // Save note text to localStorage (persists after refresh)
  document.getElementById('saveBtn').onclick = () => {
    localStorage.setItem('offlineNote', document.getElementById('note').value);
    document.getElementById('status').textContent = 'Saved to localStorage';
  };
  // Load saved note from localStorage back into the textarea
  document.getElementById('loadBtn').onclick = () => {
    document.getElementById('note').value = localStorage.getItem('offlineNote') || '';
    document.getElementById('status').textContent = 'Loaded from localStorage';
  };
</script>

<p id="onlineStatus"></p>

<script>

  function updateStatus() {

    document.getElementById('onlineStatus').textContent =

      navigator.onLine

        ? 'Online — data can sync'

        : 'Offline — using local data only';

  }

  window.addEventListener('online', updateStatus);

  window.addEventListener('offline', updateStatus);

  updateStatus();

</script>

</body>
</html>
